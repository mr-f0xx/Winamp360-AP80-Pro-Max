# WINAMP 360 v1.8 — Hidizs AP80 Pro Max (360x640 portrait)
# Keep the SBS active so its Winamp menu masthead is rendered; the SBS hides
# the built-in status strip and draws the clock, battery, and logo itself.

selector type: bar (color)
statusbar: top
scrollbar: off
volume display: graphic
battery display: numeric
foreground color: 00FF00
background color: 292941
line selector start color: E7D42F
line selector end color: E7D42F
line selector text color: 050509
font: /.rockbox/fonts/22-ProFont.fnt
list padding: 65
list separator height: 0
ui viewport: -
backdrop: -
wps: /.rockbox/wps/Winamp360.wps
sbs: /.rockbox/wps/Winamp360.sbs
